<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Harry Aytug</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">HA</a>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#news">News</a></li>
                <li><a href="index.html#publications">Publications</a></li>
                <li><a href="index.html#software">Software</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <h1 class="page-title">News & Updates</h1>

            <div class="news-list news-full" id="news-list-full">
                <!-- Loaded dynamically from news.json -->
            </div>
        </div>
    </main>
    <script>
        (function () {
            const tagLabels = { paper: 'Paper', package: 'Package', job: 'Job', patent: 'Patent', edu: 'Education' };
            fetch('news.json')
                .then(r => r.json())
                .then(news => {
                    const container = document.getElementById('news-list-full');
                    news.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'news-item';
                        div.innerHTML = `
                            <span class="news-date">${item.date}</span>
                            <span class="news-tag news-tag-${item.tag}">${tagLabels[item.tag] || item.tag}</span>
                            <span class="news-text">${item.text}</span>
                        `;
                        container.appendChild(div);
                    });
                });
        })();
    </script>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Harry Aytug. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
